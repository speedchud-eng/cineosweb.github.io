<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudMoon</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;font-family:system-ui,sans-serif}
  iframe{width:100%;height:100%;border:0;display:block;background:#000}
  #fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:#d7e3f5;background:#0b1220;text-align:center;padding:24px;gap:16px}
  #fallback h1{margin:0;font-size:22px;font-weight:600}
  #fallback p{margin:0;color:#7f95b5;font-size:13px;max-width:420px;line-height:1.6}
  #fallback a{display:inline-block;padding:10px 18px;background:#1793d1;color:#fff;text-decoration:none;border-radius:6px;font-size:13px;font-weight:600}
  #fallback a:hover{background:#1382b8}
</style>
</head>
<body>

<iframe id="cm"
  src="https://www.cloudmoonapp.com"
  allow="fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-write"
  referrerpolicy="no-referrer"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-presentation allow-downloads allow-pointer-lock"
  loading="eager"></iframe>

<div id="fallback">
  <h1>CloudMoon won't load here</h1>
  <p>CloudMoon sends <code>X-Frame-Options</code>, so it can't render inside this window. Open it in a new tab to play.</p>
  <a href="https://www.cloudmoonapp.com" target="_blank" rel="noopener noreferrer">Open CloudMoon ↗</a>
</div>

<script>
(function(){
  var f=document.getElementById("cm");
  var fb=document.getElementById("fallback");
  var loaded=false;
  var tid=setTimeout(function(){
    if(!loaded){fb.style.display="flex";f.style.display="none"}
  },6000);
  f.addEventListener("load",function(){
    loaded=true;
    clearTimeout(tid);
    try{
      var d=f.contentDocument||f.contentWindow.document;
      if(!d||!d.body||d.body.innerHTML.trim()===""){
        fb.style.display="flex";f.style.display="none";
      }
    }catch(e){/* cross-origin: assume it loaded fine */}
  });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellar</title>
<style>html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;font-family:system-ui,sans-serif}iframe{width:100%;height:100%;border:0;display:block;background:#000}#fb{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:#d7e3f5;background:#0b1220;text-align:center;padding:24px;gap:16px}#fb h1{margin:0;font-size:22px}#fb p{margin:0;color:#7f95b5;font-size:13px;max-width:420px;line-height:1.6}#fb a{display:inline-block;padding:10px 18px;background:#1793d1;color:#fff;text-decoration:none;border-radius:6px;font-size:13px;font-weight:600}</style>
</head>
<body>
<iframe id="f" src="https://stellar.gdn" allow="fullscreen; autoplay; encrypted-media; picture-in-picture; gamepad; microphone; camera; clipboard-write" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-presentation allow-downloads allow-pointer-lock"></iframe>
<div id="fb"><h1>Stellar won't load here</h1><p>Stellar requires login and blocks framing. Open it in a new tab to sign in.</p><a href="https://stellar.gdn" target="_blank" rel="noopener noreferrer">Open Stellar ↗</a></div>
<script>
(function(){var f=document.getElementById("f"),fb=document.getElementById("fb"),ld=false;var t=setTimeout(function(){if(!ld){fb.style.display="flex";f.style.display="none"}},6000);f.addEventListener("load",function(){ld=true;clearTimeout(t);try{var d=f.contentDocument||f.contentWindow.document;if(!d||!d.body||d.body.innerHTML.trim()===""){fb.style.display="flex";f.style.display="none"}}catch(e){}})})();
</script>
</body>
</html>
